    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Estilo para el icono nativo del input date */
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            border-radius: 4px;
            margin-right: 2px;
            /* Invertir y rotar para lograr un tono similar al indigo-600 */
            filter: invert(28%) sepia(91%) saturate(1974%) hue-rotate(227deg) brightness(94%) contrast(101%);
        }
    </style>
